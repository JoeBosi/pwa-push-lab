# Modello del vhost: deploy.sh sostituisce __DOMINIO__ con il dominio scelto.
# PWA di prova per le notifiche push - servizio systemd "pwa-notifiche",
# node su 127.0.0.1:3020.
#
# NESSUNA basic_auth, e non e' una dimenticanza: il basic auth manda in errore
# la richiesta con cui il browser scarica il service worker e il manifest, e su
# iOS impedisce del tutto l'aggiunta alla schermata Home. Qui non c'e' niente da
# proteggere: il sito conserva solo gli indirizzi push di chi si iscrive da se'.
__DOMINIO__ {
    encode gzip

    reverse_proxy 127.0.0.1:3020 {
        header_up X-Real-IP {remote_host}
    }

    header {
        X-Content-Type-Options nosniff
        Referrer-Policy no-referrer
        Strict-Transport-Security "max-age=31536000; includeSubDomains"
        -Server

        # worker-src 'self' e' la direttiva che autorizza il service worker:
        # senza, il browser lo blocca e non arriva nessuna notifica.
        # connect-src 'self' serve alle chiamate /api/. Niente CDN: tutto il
        # codice di questa pagina e' servito da qui.
        Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    }
}
